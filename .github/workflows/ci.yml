---

name: CI & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

# ─── Stage 1: pre-commit ─────────────────────────────────────────────────────
# JSON/YAML parsing+linting, Ruff, Mypy, Pytest.
# ─── Stage 2: semantic-release ───────────────────────────────────────────────
# Calculates release/tag metadata, then builds distributions once and uploads artifact.
# ─── Stage 3: publish-github ─────────────────────────────────────────────────
# Uploads built artifacts to GitHub Release when a release exists.
# ─── Stage 4: publish-pypi ───────────────────────────────────────────────────
# Always publishes on push to main (independent of semantic-release outputs).

jobs:
  # ── Stage 1 ─────────────────────────────────────────────────────────────────
  pre-commit:
    name: "Stage 1 · JSON+YAML / Ruff / Mypy / Pytest"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Validate JSON files
        run: |
          find . -name "*.json" \
            -not -path "./.venv/*" \
            -not -path "./node_modules/*" \
            | sort | while read -r f; do
              python -m json.tool "$f" > /dev/null && echo "✓ $f" || exit 1
            done

      - name: Lint YAML files
        run: uvx yamllint --config-file .yamllint.yml .github/

      - name: Lint & Format Check (Ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type Check (Mypy)
        run: uv run mypy .

      - name: Run Tests (Pytest)
        run: uv run pytest --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Stage 2 ─────────────────────────────────────────────────────────────────
  semantic-release:
    name: "Stage 2 · Semantic Release & Build Dist"
    needs: pre-commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}
      # release_notes is consumed by Stage 3 to populate the GitHub release body
      release_notes: ${{ steps.release.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false
          changelog: false
          build: false
          vcs_release: false

      - name: Normalize version for build
        if: steps.release.outputs.released != 'true'
        run: |
          latest_tag="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          if [ -z "$latest_tag" ]; then
            echo "No git tag found, keeping pyproject version as-is."
            exit 0
          fi

          export LATEST_TAG="$latest_tag"

          python - <<'PY'
          import os
          import pathlib
          import re

          pyproject = pathlib.Path("pyproject.toml")
          content = pyproject.read_text(encoding="utf-8")
          latest = os.environ["LATEST_TAG"].strip()

          updated, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{latest}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate project.version in pyproject.toml")

          pyproject.write_text(updated, encoding="utf-8")
          print(f"Set build version in pyproject.toml to {latest}")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Build distributions
        run: uv build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

      - name: Save Release Notes
        if: steps.release.outputs.released == 'true'
        env:
          NOTES: ${{ steps.release.outputs.release_notes }}
        # Use printf with a fixed format string so special chars in $NOTES are never
        # interpreted as format specifiers; avoids a trailing newline that echo adds.
        run: printf '%s' "$NOTES" > release-notes.md

      - name: Upload Release Notes Artifact
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # ── Stage 3 ─────────────────────────────────────────────────────────────────
  publish-github:
    name: "Stage 3 · Publish GitHub"
    needs: semantic-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Distribution Artifacts
        if: needs.semantic-release.outputs.released == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download Release Notes
        if: needs.semantic-release.outputs.released == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Create GitHub Release with Assets
        if: needs.semantic-release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.semantic-release.outputs.tag }}
        run: gh release create "$TAG" dist/* --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"

  publish-pypi:
    name: "Stage 4 · Publish PyPI"
    needs: publish-github
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
