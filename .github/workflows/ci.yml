---

name: CI & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

# ─── Stage 1: pre-commit ─────────────────────────────────────────────────────
# JSON/YAML parsing+linting, Ruff, Mypy, Pytest.
# ─── Stage 2: build-dist ─────────────────────────────────────────────────────
# Builds package distributions once and uploads them as workflow artifact.
# ─── Stage 3: semantic-release ───────────────────────────────────────────────
# Calculates and creates release/tag metadata.
# ─── Stage 4: publish-github ─────────────────────────────────────────────────
# Uploads built artifacts to GitHub Release when a release exists.
# ─── Stage 5: publish-pypi ───────────────────────────────────────────────────
# Always publishes on push to main (independent of semantic-release outputs).

jobs:
  # ── Stage 1 ─────────────────────────────────────────────────────────────────
  pre-commit:
    name: "Stage 1 · JSON+YAML / Ruff / Mypy / Pytest"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Validate JSON files
        run: |
          find . -name "*.json" \
            -not -path "./.venv/*" \
            -not -path "./node_modules/*" \
            | sort | while read -r f; do
              python -m json.tool "$f" > /dev/null && echo "✓ $f" || exit 1
            done

      - name: Lint YAML files
        run: uvx yamllint --config-file .yamllint.yml .github/

      - name: Lint & Format Check (Ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type Check (Mypy)
        run: uv run mypy .

      - name: Run Tests (Pytest)
        run: uv run pytest --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Stage 2 ─────────────────────────────────────────────────────────────────
  build-dist:
    name: "Stage 2 · Build & Upload Dist Artifact"
    needs: pre-commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Build distributions
        run: uv build

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # ── Stage 3 ─────────────────────────────────────────────────────────────────
  semantic-release:
    name: "Stage 3 · Semantic Release"
    needs: build-dist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false
          changelog: false
          build: false

  # ── Stage 4 ─────────────────────────────────────────────────────────────────
  publish-github:
    name: "Stage 4 · Publish GitHub"
    needs: semantic-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Distribution Artifacts
        if: needs.semantic-release.outputs.released == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Upload Release Assets
        if: needs.semantic-release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.semantic-release.outputs.tag }}

  publish-pypi:
    name: "Stage 5 · Publish PyPI"
    needs: publish-github
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download Distribution Artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
